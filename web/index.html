<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FaStar — DeepSeek V4 Flash Chat</title>
<style>
  :root {
    --bg: #0f1117; --panel: #181b24; --panel-2: #20242f; --border: #2a2f3c;
    --fg: #e6e6e6; --muted: #8a8f9c; --accent: #4f8cff; --user: #2b3a5e; --asst: #1d212b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 12px 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header .sub { color: var(--muted); font-size: 12px; }
  header button {
    margin-left: auto; background: var(--panel-2); color: var(--muted);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px;
    cursor: pointer; font-size: 12px;
  }
  header button:hover { color: var(--fg); border-color: var(--accent); }
  #log {
    flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px;
  }
  .msg { max-width: 860px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 4px; }
  .msg .role { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .bubble {
    padding: 11px 14px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word;
    border: 1px solid var(--border);
  }
  .msg.user .bubble { background: var(--user); }
  .msg.asst .bubble { background: var(--asst); }
  .bubble .cursor { display: inline-block; width: 7px; height: 15px; background: var(--accent);
    vertical-align: text-bottom; margin-left: 2px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  form {
    padding: 14px 18px; border-top: 1px solid var(--border); background: var(--panel);
    display: flex; gap: 10px; max-width: 860px; width: 100%; margin: 0 auto;
  }
  form textarea {
    flex: 1; resize: none; height: 52px; max-height: 160px; padding: 11px 13px;
    background: var(--panel-2); color: var(--fg); border: 1px solid var(--border);
    border-radius: 9px; font: inherit; outline: none;
  }
  form textarea:focus { border-color: var(--accent); }
  form button {
    background: var(--accent); color: #fff; border: none; border-radius: 9px;
    padding: 0 20px; font: inherit; font-weight: 600; cursor: pointer;
  }
  form button:disabled { opacity: .45; cursor: not-allowed; }
  .err { color: #ff6b6b; }
  #status { font-size: 11px; color: var(--muted); text-align: center; padding-bottom: 4px; }
</style>
</head>
<body>
<header>
  <h1>FaStar</h1>
  <span class="sub">DeepSeek V4 Flash · 284B MoE · AMD Ryzen AI NPU</span>
  <button id="resetBtn" title="Clear the conversation and KV cache">New chat</button>
</header>
<div id="log"></div>
<div id="status"></div>
<form id="f">
  <textarea id="inp" placeholder="Send a message…  (Enter to send, Shift+Enter for newline)" autofocus></textarea>
  <button id="send" type="submit">Send</button>
</form>

<script>
const log = document.getElementById('log');
const inp = document.getElementById('inp');
const form = document.getElementById('f');
const sendBtn = document.getElementById('send');
const resetBtn = document.getElementById('resetBtn');
const status = document.getElementById('status');
let busy = false;

function addMsg(role, text) {
  const m = document.createElement('div');
  m.className = 'msg ' + role;
  m.innerHTML = '<div class="role">' + (role === 'user' ? 'You' : 'Assistant') + '</div>' +
                '<div class="bubble"></div>';
  m.querySelector('.bubble').textContent = text;
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return m.querySelector('.bubble');
}

function setStatus(t) { status.textContent = t; }

async function streamGenerate(prompt, reset) {
  const bubble = addMsg('asst', '');
  let cur = document.createElement('span');
  cur.className = 'cursor';
  bubble.appendChild(cur);
  let text = '';
  const params = { prompt, tokens: 256, temp: 0.7, top_p: 0.9, reset };
  const resp = await fetch('/generate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(params)
  });
  if (!resp.ok || !resp.body) {
    cur.remove();
    bubble.classList.add('err');
    bubble.textContent = 'Error: ' + resp.status + ' ' + (await resp.text());
    return;
  }
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, nl); buf = buf.slice(nl + 2);
        for (const line of chunk.split('\n')) {
          if (!line.startsWith('data:')) continue;
          const payload = line.slice(5).trim();
          if (!payload) continue;
          let ev;
          try { ev = JSON.parse(payload); } catch { continue; }
          if (ev.done) { buf = ''; break; }
          text += ev.text;
          cur.remove();
          bubble.textContent = text;
          bubble.appendChild(cur);
          log.scrollTop = log.scrollHeight;
        }
      }
    }
  } catch (e) {
    text += '\n[stream interrupted: ' + e + ']';
  }
  cur.remove();
  bubble.textContent = text;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const prompt = inp.value.trim();
  if (!prompt || busy) return;
  busy = true; sendBtn.disabled = true;
  inp.value = '';
  addMsg('user', prompt);
  setStatus('Generating…  (prefill can take ~2 min for the first token on this hardware)');
  try {
    await streamGenerate(prompt, false);
  } catch (e) {
    setStatus('Error: ' + e);
  }
  setStatus('');
  busy = false; sendBtn.disabled = false;
  inp.focus();
});

resetBtn.addEventListener('click', async () => {
  if (busy) return;
  await fetch('/reset', { method: 'POST' });
  log.innerHTML = '';
  setStatus('Session reset — KV cache cleared.');
});

inp.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
inp.addEventListener('input', () => {
  inp.style.height = 'auto'; inp.style.height = Math.min(160, inp.scrollHeight) + 'px';
});
</script>
</body>
</html>
